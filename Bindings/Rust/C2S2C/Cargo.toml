[package]
name = "c2s2c"
version = "0.1.0"
edition = "2021"
description = "Safe Rust binding of the C2S2C packet library"
license = "MIT"
build = "build.rs"

[lib]
path = "Source/lib.rs"

[dependencies]
c2s2c-sys = { path = "../C2S2CSys" }

[[bin]]
name = "chat_server_rust"
path = "../../../Examples/Rust/Server/chat_server.rs"

[[bin]]
name = "chat_client_rust"
path = "../../../Examples/Rust/Client/chat_client.rs"

[[test]]
name = "bindings"
path = "../../../Tests/Bindings/Rust/test_rust.rs"

[[bin]]
name = "bench_ffi_rust"
path = "../../../Bench/Ffi/bench_ffi.rs"

[[bin]]
name = "bench_service_c2s2c"
path = "../../../Bench/Service/Rust/server_c2s2c.rs"

[[bin]]
name = "bench_service_naive"
path = "../../../Bench/Service/Rust/server_naive.rs"
