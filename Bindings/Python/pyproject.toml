[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "duplex"
version = "0.1.0"
description = "Python binding of the Duplex packet library (ctypes, no dependency)"
requires-python = ">=3.9"

[tool.setuptools]
packages = ["duplex"]
py-modules = ["duplex_registry"]

[tool.setuptools.package-dir]
duplex = "Source"
"" = "../../Generated/Python"
