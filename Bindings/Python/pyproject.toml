[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "c2s2c"
version = "1.0.0"
description = "Python binding of the C2S2C packet library (ctypes, no dependency)"
requires-python = ">=3.9"

[tool.setuptools]
packages = ["c2s2c"]

[tool.setuptools.package-dir]
c2s2c = "Source"
